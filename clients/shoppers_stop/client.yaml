# Shoppers Stop: the client this project was first built for.
# Everything client-specific lives in this folder; the engine never names a client (ADR-007).

name: Shoppers Stop
languages: [en, hi]  # English, Hindi; Hinglish is handled as both

# Rupees. Low below 3,000; Medium 3,000 to 10,000; High above 10,000 (ADR-005).
spend_tiers:
  medium_from: 3000
  high_above: 10000

tools:
  - search_products
  - customer_insights
  - record_feedback
  - escalate_to_human

llm:
  model: ""  # chosen in Step 01 from the models the key can see (ADR-009)
  max_tool_rounds: 5

webhook_url: null  # mock CRM receiver, Step 07
